        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #070b14; color: white; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-card { width: 100%; max-width: 550px; text-align: center; }
        
        h1 { color: #fbbf24; margin-bottom: 10px; font-size: 2rem; text-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
        .tagline { margin-bottom: 25px; font-size: 0.85rem; color: #94a3b8; letter-spacing: 1px; }
        
        /* SEARCH BOX */
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; background: #111827; padding: 8px; border-radius: 15px; border: 1px solid #1f2937; }
        input { 
            flex: 1; padding: 15px; border-radius: 10px; border: none; 
            background: transparent; color: white; outline: none; font-size: 1rem;
        }
        button#find { background: #fbbf24; border: none; padding: 0 25px; border-radius: 10px; cursor: pointer; font-weight: 800; color: #000; transition: 0.2s; }
        button#find:active { transform: scale(0.95); }

        /* RISULTATI */
        #result-area { display: none; animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .film-badge { background: #fbbf24; color: #000; padding: 5px 15px; border-radius: 20px; margin-bottom: 25px; display: inline-block; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }

        /* SEZIONE DOPPIA */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .card { background: #111827; padding: 20px; border-radius: 20px; text-align: left; border: 1px solid #1f2937; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .card h3 { color: #fbbf24; margin-bottom: 15px; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
        
        ul { list-style: none; }
        li { margin-bottom: 10px; font-size: 0.95rem; color: #e2e8f0; display: flex; align-items: center; }
        li::before { content: "✔"; color: #fbbf24; margin-right: 12px; font-weight: bold; }

        /* BOTTONI ORDINE */
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .btn-order { 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; transition: 0.3s;
        }
        .glovo { background: #ffc244; color: #00a082; }

        .back-link { display: inline-block; margin-top: 40px; color: #4b5563; text-decoration: none; font-size: 0.8rem; border-bottom: 1px solid transparent; }
        .back-link:hover { border-bottom-color: #4b5563; }
