<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>FoodCiak</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#070b14">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0a0a12; color: #fff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: flex-start; 
            min-height: 100vh; overflow-x: hidden; padding-top: 20px;
        }

        .container { text-align: center; width: 95%; max-width: 600px; padding: 10px; }

        h1 { font-size: 2.2rem; color: #ff9f43; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 15px rgba(255,159,67,0.5); }
        .subtitle { font-size: 0.8rem; color: #888; margin-bottom: 20px; }

        /* BARRA SUPERIORE CERCA */
        .top-bar { margin-bottom: 20px; }
        .search-btn {
            display: block; width: 100%; text-align: center; color: #888; text-decoration: none; 
            font-size: 0.75rem; border: 1px solid #333; padding: 12px; border-radius: 12px; 
            background: #111827; transition: 0.3s;
        }

        /* LAYOUT GENERI + ROULETTE */
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr; /* Generi più larghi, Roulette a destra */
            gap: 10px;
            margin-bottom: 20px;
        }

        .genre-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .genre-btn {
            background: #1e1e2e; border: 2px solid #333; color: #ccc;
            padding: 15px 5px; border-radius: 15px; font-weight: 600; cursor: pointer;
            transition: 0.3s; font-size: 0.8rem;
        }
        .genre-btn.active { background: #ff9f43; color: #000; border-color: #ff9f43; box-shadow: 0 0 15px rgba(255,159,67,0.4); }

        .roulette-link {
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000; text-decoration: none; border-radius: 15px;
            font-weight: 800; font-size: 0.75rem; text-align: center;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2); padding: 10px;
        }

        /* SUGGERITORE FILM */
        .random-box {
            background: #1e1e2e; border-radius: 20px; padding: 20px;
            margin: 20px 0; border: 1px solid #333;
        }
        .random-btn {
            width: 100%; padding: 12px; font-size: 0.9rem; font-weight: 800;
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            color: white; border: none; border-radius: 12px; cursor: pointer;
            text-transform: uppercase; margin-bottom: 10px;
        }
        #filmRisultato { font-size: 1.1rem; font-weight: 700; color: #ff9f43; min-height: 24px; }

        /* RISULTATO ABBINAMENTO */
        #result-card {
            background: #1e1e2e; border-radius: 20px; padding: 25px;
            border: 1px solid #333; display: none;
            animation: slideIn 0.5s ease-out; margin-top: 20px;
        }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .pairing-title { font-size: 0.7rem; color: #ff9f43; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
        .item-name { font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 15px; }
        .vibe-note { font-size: 0.8rem; color: #aaa; font-style: italic; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <a href="cerca.html" class="search-btn">🔍 CERCA FILM</a>
        </div>

        <h1>CineGusto</h1>
        <p class="subtitle">Scegli il genere, svolta la serata.</p>
        
        <div class="main-grid" style="grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 20px; display: grid;">
            <div class="genre-selector" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                <button class="genre-btn" onclick="showPairing('action')">AZIONE 💥</button>
                <button class="genre-btn" onclick="showPairing('comedy')">COMMEDIA 😂</button>
                <button class="genre-btn" onclick="showPairing('horror')">HORROR 😱</button>
                <button class="genre-btn" onclick="showPairing('sci-fi')">SCI-FI 🚀</button>
                <button class="genre-btn" onclick="showPairing('animation')">CARTOON 🦊</button>
                <button class="genre-btn" onclick="showPairing('thriller')">THRILLER 🕵️</button>
                <button class="genre-btn" onclick="showPairing('fantasy')">FANTASY 🧙‍♂️</button>
                <button class="genre-btn" onclick="showPairing('docu')">DOCU 🌍</button>
            </div>
            
            <a href="roulette.html" class="roulette-link" style="display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; text-decoration: none; border-radius: 15px; font-weight: 800; font-size: 0.75rem; text-align: center; padding: 10px;">
                🎰<br>MOOD<br>ROULETTE
            </a>
        </div>

        <div class="random-box">
            <button class="random-btn" onclick="scegliFilm()">🎲 Suggeriscimi un Film!</button>
            <p id="filmRisultato">Stasera cosa guardiamo?</p>
        </div>

        <div id="result-card">
            <div class="pairing-title">Abbinamento Perfetto</div>
            <div id="food-name" class="item-name"></div>
            <div id="drink-name" class="item-name" style="color: #ff9f43;"></div>
            <div id="vibe-note" class="vibe-note"></div>
        </div>
    </div>

    'action': { 
        food: "Pizza Diavola, Burritos o Hot Dog 🌭", 
        drink: "Birra Media, Coca Zero o Red Bull ⚡", 
        vibe: "Luci spente, volume a palla. Preparati all'adrenalina." 
    },
    'comedy': { 
        food: "Popcorn Giganti, Nachos o Chips 🍟", 
        drink: "Chinotto, Spritz o Cedrata 🍹", 
        vibe: "Atmosfera rilassata. Condividi il cibo e ridi di gusto." 
    },
    'horror': { 
        food: "Sushi, Tartare (Crudo) o Ali di Pollo Piccanti 🔥", 
        drink: "Vino Rosso, Bloody Mary o Succo di Melograno 🍷", 
        vibe: "Solo una candela accesa. Tieni i cuscini a portata di mano." 
    },
    'sci-fi': { 
        food: "Pokè Colorato, Noodles o Ramen 🍜", 
        drink: "Energy Drink, Cocktail Blu o Acqua Tonica 🥤", 
        vibe: "Luci LED se le hai. Immergiti nel futuro." 
    },
    'animation': { 
        food: "Cereal Bowl, Pancake o Zucchero Filato 🥞", 
        drink: "Succo di Frutta, Frappè o Cioccolata Calda 🥛", 
        vibe: "Torna bambino e goditi l'esplosione di colori!" 
    },
    'thriller': { 
        food: "Hamburger Gourmet, Tartine al Salmone o Formaggi Stagionati 🧀", 
        drink: "Caffè Nero, Whisky o Gin Tonic 🍸", 
        vibe: "Tutto buio. Concentrazione massima su ogni dettaglio." 
    },
    'fantasy': { 
        food: "Coscia di Pollo, Pane e Formaggio o Stufato 🍖", 
        drink: "Sidro, Tè ai Frutti di Bosco o Birra Artigianale 🍺", 
        vibe: "Prepara la spada (o il telecomando), si parte per l'avventura." 
    },
    'docu': { 
        food: "Insalata Greca, Frutta Secca o Hummus 🥗", 
        drink: "Tè Verde, Acqua e Limone o Kombucha 🍵", 
        vibe: "Mente aperta. Impara qualcosa di incredibile sul mondo." 
    }
};

        function showPairing(genre) {
            const buttons = document.querySelectorAll('.genre-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const pair = pairings[genre];
            document.getElementById('food-name').innerText = "🍴 " + pair.food;
            document.getElementById('drink-name').innerText = "🥤 " + pair.drink;
            document.getElementById('vibe-note').innerText = pair.vibe;
            document.getElementById('result-card').style.display = 'block';
        }

    const scelta = film[indice];

    // Animazione testo: cambia il testo mentre "gira"
    let count = 0;
    const interval = setInterval(() => {
        document.getElementById("filmRisultato").innerText = "Scegliendo... 🎲";
        count++;

}
    </script>
